name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP and archive tooling
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli zip unzip
          php -v | head -1
      - name: PHP syntax check
        run: |
          errors=0
          find includes -name '*.php' | while read -r f; do php -l "$f" || exit 1; done
          echo "All PHP files pass syntax check"
      - name: Version sync gate
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          HEADER_VER=$(grep "Version:" elementeer.php | head -1 | sed 's/.*Version: *//' | xargs)
          PHP_VER=$(grep "ELEMENTEER_VERSION" elementeer.php | head -1 | sed "s/.*'\(.*\)'.*/\1/" | xargs)
          echo "Tag:     $TAG"
          echo "Version: $VERSION"
          echo "Header:  $HEADER_VER"
          echo "Const:   $PHP_VER"
          if [ "$HEADER_VER" != "$VERSION" ]; then
            echo "ERROR: Header Version ($HEADER_VER) != tag ($VERSION)"
            exit 1
          fi
          if [ "$PHP_VER" != "$VERSION" ]; then
            echo "ERROR: ELEMENTEER_VERSION ($PHP_VER) != tag ($VERSION)"
            exit 1
          fi
          README_VER=$(grep -i "^Stable tag:" readme.txt | sed 's/.*: *//' | xargs)
          echo "Readme:  $README_VER"
          if [ "$README_VER" != "$VERSION" ]; then
            echo "ERROR: readme.txt Stable tag ($README_VER) != tag ($VERSION)"
            echo "WordPress serves the version named by Stable tag. A drifted"
            echo "value ships the wrong release to every site."
            exit 1
          fi
          echo "Version sync OK: $VERSION (header, constant, readme)"
      - name: Build Plugin ZIP
        run: |
          bash scripts/create-plugin-zip.sh
          ZIP=$(ls /tmp/elementeer-build-final/*/elementeer.*.zip | head -1)
          echo "ZIP=$ZIP" >> $GITHUB_ENV
      - name: Verify ZIP structure
        run: |
          # Capture the listing first: piping straight into `grep -q` makes grep
          # close the pipe on the first match, unzip dies of SIGPIPE, and under
          # pipefail (which the runner enables) that fails the step even though
          # the ZIP is correct.
          listing=$(unzip -l "$ZIP")
          if ! printf '%s\n' "$listing" | grep -q "elementeer/"; then
            echo "ZIP structure INVALID"
            exit 1
          fi
          echo "ZIP structure OK: $(unzip -l "$ZIP" | tail -1)"
      - name: Install Python
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv

      - name: Install ops-engine (v3.7.0)
        run: |
          # ops-engine v3.7.0 wheel — not yet released at commit time.
          # The owner merges only after the v3.7.0 tag exists.
          ENGINE_VENV="$(mktemp -d)/engine-venv"
          python3 -m venv "$ENGINE_VENV"
          "$ENGINE_VENV/bin/python" -m pip install --quiet \
            https://github.com/LangeVC/ops-engine/releases/download/v3.7.0/ops_engine-3.7.0-py3-none-any.whl
          echo "ENGINE_VENV=$ENGINE_VENV" >> "$GITHUB_ENV"

      - name: Stage ZIP for engine attach
        run: |
          cp "$ZIP" .
          ls -la elementeer.*.zip

      - name: Attach ZIP to release on both forges
        env:
          TAG_NAME: "${{ github.ref_name }}"
          FORGEJO_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_MIRROR_TOKEN: "${{ secrets.GH_MIRROR_TOKEN }}"
        run: |
          "$ENGINE_VENV/bin/python" - "$TAG_NAME" "${{ github.repository }}" <<'PY'
          import asyncio, os, sys

          tag_name = sys.argv[1]
          repo = sys.argv[2]
          org, _, repo_name = repo.partition("/")

          from ops_engine.adapters.factory import Credential, adapters_for
          from ops_engine.config_loader import OpsEngineConfig, load_ops_yaml
          from ops_engine.modules.release import ReleaseHandler

          layer3 = load_ops_yaml(".")
          if layer3 is None:
              print("::error::MissingOpsYamlError: no .ops.yaml", file=sys.stderr)
              sys.exit(2)

          config = OpsEngineConfig.load({
              "orgs": {
                  org: {
                      "repositories": {
                          repo_name: {
                              "destinations": [
                                  {"forge": d.forge, "repo": d.repo,
                                   "role": d.role, "visibility": d.visibility}
                                  for d in layer3.destinations
                              ]
                          }
                      }
                  }
              }
          })

          credentials = {
              "forgejo": Credential(token=os.environ["FORGEJO_TOKEN"]),
              "github": Credential(token=os.environ["GH_MIRROR_TOKEN"]),
          }
          adapters = adapters_for(layer3.destinations, credentials=credentials)

          async def main():
              report = await ReleaseHandler.publish_release(
                  config, repo, tag_name, "", ".",
                  name_template=layer3.release.name_template,
                  adapters=adapters,
              )
              published = ", ".join(report.published) or "(none)"
              failed = ", ".join(report.failed) or "(none)"
              print(f"published destinations: {published}")
              print(f"failed destinations: {failed}")
              if report.failed:
                  print(f"::error::PartialPublicationError: {failed}",
                        file=sys.stderr)
                  sys.exit(1)

          asyncio.run(main())
          PY

      # The release object is not created here. The ops-engine ReleaseHandler
      # publishes it on tag_push from .ops.yaml (destinations forgejo and
      # github) and attaches the artifact it collects with the changelog body.
      # This workflow stays a gate: syntax, version sync, ZIP build and
      # structure, then calls the engine to attach the ZIP on both forges.
      # The ops-engine install line is untestable until v3.7.0 exists; the
      # owner merges only after that tag is published.
