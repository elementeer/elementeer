name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP and archive tooling
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli zip unzip
          php -v | head -1
      - name: PHP syntax check
        run: |
          errors=0
          find includes -name '*.php' | while read -r f; do php -l "$f" || exit 1; done
          echo "All PHP files pass syntax check"
      - name: Version sync gate
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          HEADER_VER=$(grep "Version:" elementeer.php | head -1 | sed 's/.*Version: *//' | xargs)
          PHP_VER=$(grep "ELEMENTEER_VERSION" elementeer.php | head -1 | sed "s/.*'\(.*\)'.*/\1/" | xargs)
          echo "Tag:     $TAG"
          echo "Version: $VERSION"
          echo "Header:  $HEADER_VER"
          echo "Const:   $PHP_VER"
          if [ "$HEADER_VER" != "$VERSION" ]; then
            echo "ERROR: Header Version ($HEADER_VER) != tag ($VERSION)"
            exit 1
          fi
          if [ "$PHP_VER" != "$VERSION" ]; then
            echo "ERROR: ELEMENTEER_VERSION ($PHP_VER) != tag ($VERSION)"
            exit 1
          fi
          README_VER=$(grep -i "^Stable tag:" readme.txt | sed 's/.*: *//' | xargs)
          echo "Readme:  $README_VER"
          if [ "$README_VER" != "$VERSION" ]; then
            echo "ERROR: readme.txt Stable tag ($README_VER) != tag ($VERSION)"
            echo "WordPress serves the version named by Stable tag. A drifted"
            echo "value ships the wrong release to every site."
            exit 1
          fi
          echo "Version sync OK: $VERSION (header, constant, readme)"
      - name: Build Plugin ZIP
        run: |
          bash scripts/create-plugin-zip.sh
          ZIP=$(ls /tmp/elementeer-build-final/*/elementeer.*.zip | head -1)
          echo "ZIP=$ZIP" >> $GITHUB_ENV
      - name: Verify ZIP structure
        run: |
          # Capture the listing first: piping straight into `grep -q` makes grep
          # close the pipe on the first match, unzip dies of SIGPIPE, and under
          # pipefail (which the runner enables) that fails the step even though
          # the ZIP is correct.
          listing=$(unzip -l "$ZIP")
          if ! printf '%s\n' "$listing" | grep -q "elementeer/"; then
            echo "ZIP structure INVALID"
            exit 1
          fi
          echo "ZIP structure OK: $(unzip -l "$ZIP" | tail -1)"
      - name: Install Python
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv

      - name: Install ops-engine (v3.7.0)
        run: |
          # ops-engine v3.7.0 wheel — not yet released at commit time.
          # The owner merges only after the v3.7.0 tag exists.
          ENGINE_VENV="$(mktemp -d)/engine-venv"
          python3 -m venv "$ENGINE_VENV"
          "$ENGINE_VENV/bin/python" -m pip install --quiet \
            https://github.com/LangeVC/ops-engine/releases/download/v3.7.0/ops_engine-3.7.0-py3-none-any.whl
          echo "ENGINE_VENV=$ENGINE_VENV" >> "$GITHUB_ENV"

      - name: Stage ZIP for engine attach
        run: |
          # The engine attaches every regular file in the directory it is
          # given, by basename, so the ZIP is staged into a directory of its
          # own. The ZIP lives in /tmp/elementeer-build-final/*/ after the
          # build script.
          mkdir -p release-assets
          cp "$ZIP" release-assets/
          ls -l release-assets

      # The CLI reads a Layer-2 config, and its credential lookup walks that
      # config's destinations. The destinations live in this repository's
      # Layer-3 .ops.yaml, so the config is written at run time from that file:
      # no forge, repository, host or credential name is restated in the
      # workflow, and the token variables named here are the ones this job
      # exports below. The declared title is read from the same file rather
      # than spelled out, so it is one value in one place.
      - name: Write the destination config from .ops.yaml
        run: |
          set -euo pipefail
          "$ENGINE_VENV/bin/python" - <<'CONFIG_PY'
          import os
          import sys
          from pathlib import Path

          import yaml

          from ops_engine.config_loader import OpsYamlError, load_ops_yaml

          try:
              layer3 = load_ops_yaml(".")
          except OpsYamlError as exc:
              print(f"::error::OpsYamlError: {exc}", file=sys.stderr)
              sys.exit(2)
          if layer3 is None:
              print(
                  "::error::MissingOpsYamlError: no .ops.yaml at the "
                  "repository root.",
                  file=sys.stderr,
              )
              sys.exit(2)
          dests = layer3.destinations
          if not dests:
              print(
                  "::error::MissingReleaseDestinationsError: .ops.yaml "
                  "declares no destinations.",
                  file=sys.stderr,
              )
              sys.exit(2)

          org, _, repo_name = os.environ["GITHUB_REPOSITORY"].partition("/")

          # The credential variable each forge's destination reads. Declaring
          # it here, next to the token the job exports, is what lets the CLI
          # resolve a per-destination credential without a second config file.
          CREDENTIAL_VARS = {"forgejo": "FORGEJO_TOKEN", "github": "GH_MIRROR_TOKEN"}

          dest_list = []
          for d in dests:
              entry = {
                  "forge": d.forge,
                  "repo": d.repo,
                  "role": d.role,
                  "visibility": d.visibility,
              }
              var = CREDENTIAL_VARS.get(d.forge.strip().lower())
              if var:
                  entry["credential_variable"] = var
              dest_list.append(entry)

          config = {
              "orgs": {
                  org: {"repositories": {repo_name: {"destinations": dest_list}}}
              }
          }
          config_path = Path(os.environ["RUNNER_TEMP"]) / "release-config.yml"
          with open(config_path, "w", encoding="utf-8") as fh:
              yaml.dump(config, fh, default_flow_style=False)
          print(f"config written to {config_path}", file=sys.stderr)

          name_template = layer3.release.name_template if layer3.release else ""
          if name_template:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
                  fh.write(f"NAME_TEMPLATE={name_template}\n")
          CONFIG_PY

      # The workflow calls the engine's entry point; it does not reimplement
      # publication and it writes no release object itself. The CLI finds or
      # creates the release, converges it, attaches the staged ZIP, and reads
      # the release back to verify the asset .ops.yaml declares — failing the
      # destination by name when it is absent.
      - name: Attach ZIP to release on both forges
        env:
          TAG_NAME: "${{ github.ref_name }}"
          FORGEJO_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_MIRROR_TOKEN: "${{ secrets.GH_MIRROR_TOKEN }}"
        run: |
          set -euo pipefail
          "$ENGINE_VENV/bin/python" -m ops_engine.release_attach \
            --config "$RUNNER_TEMP/release-config.yml" \
            --repo "${{ github.repository }}" \
            --tag "$TAG_NAME" \
            --artifacts release-assets \
            --repo-dir . \
            --name-template "$NAME_TEMPLATE"

      # The release object is not created here, and this workflow is now the
      # only writer on the Forgejo side: .github/workflows/release-github.yml
      # stopped creating the GitHub release object in RFL-015 and keeps only
      # the syntax, build and WordPress-activation gates with the ZIP artifact.
      # So the object on both forges is created by this workflow's single call
      # to the engine entry point, from .ops.yaml. This workflow stays a gate:
      # syntax, version sync, ZIP build and structure, then the entry point
      # call above. The ops-engine install line is untestable until v3.7.0
      # exists; the owner merges only after that tag is published.
